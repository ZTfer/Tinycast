
# TinyCast 样式配置 - 整合颜色和字体排版

include "colors.conf"
include "typography.conf"

{
  version = 0.1
  name = "Styles"
  # 小部件样式
  # 用于配置应用的小部件样式，如列表项、卡片等
  widgets{
    # Episode Item 样式
    episode_item{
      # 用于 episode 列表项的样式
      title{
        # Episode Title 样式
        # 使用 typography.conf 中 textstyles.h3.desktop 样式
        # 使用 colors.conf 中 palettes.label.primary 颜色
        fontsize = ${textstyles.h3.desktop.fontsize}
        fontweight = ${textstyles.h3.desktop.fontweight}
        lineheight = ${textstyles.h3.desktop.lineheight}
        letterspacing = ${textstyles.h3.desktop.letterspacing}
        color = ${palettes.label.primary.light}
      }
      description{
        # 描述文字样式
        # 使用 typography.conf 中 textstyles.caption1.desktop 样式
        # 使用 colors.conf 中 palettes.label.tertiary 颜色
        fontsize = ${textstyles.caption1.desktop.fontsize}
        fontweight = ${textstyles.caption1.desktop.fontweight}
        lineheight = ${textstyles.caption1.desktop.lineheight}
        letterspacing = ${textstyles.caption1.desktop.letterspacing}
        color = ${palettes.label.tertiary.light}
      }
      pubDate{
        # 发布时间文字样式
        # 使用 typography.conf 中 textstyles.caption2.desktop 样式
        # 使用 colors.conf 中 palettes.label.tertiary 颜色
        fontsize = ${textstyles.caption2.desktop.fontsize}
        fontweight = ${textstyles.caption2.desktop.fontweight}
        lineheight = ${textstyles.caption2.desktop.lineheight}
        letterspacing = ${textstyles.caption2.desktop.letterspacing}
        color = ${palettes.label.tertiary.light}
      }
    }
    # Home Toolbar 样式
    home_toolbar{
      # 用于 home toolbar 按钮样式
      home_toolbar_button {
        # 按钮背景色
        background = {
          # 鼠标悬停颜色
          hover = ${palettes.gray.gray-10.light}
          # 鼠标点击颜色
          pressed = ${palettes.gray.gray-30.light}
          # 默认背景颜色
          default = ${palettes.gray.gray-0.light}
        }
        # 按钮内容颜色
        content_color = {
          text = ${palettes.label.primary.light}
          # 暂时不自定义图标颜色
          # icon = ${palettes.label.primary.light}
        }
      }
    }
    # Mini Player 样式
    mini_player {
      episode_info{
        cover{
          width = 54.0
          height = 54.0
          fit = BoxFit.cover
          borderRadius = 8.0
        }
        episode_title{
          fontsize = ${textstyles.h3.desktop.fontsize}
          fontweight = ${textstyles.h3.desktop.fontweight}
          lineheight = ${textstyles.h3.desktop.lineheight}
          letterspacing = ${textstyles.h3.desktop.letterspacing}
          color = ${palettes.label.primary.light}
        }
        podcast_title{
          fontsize = ${textstyles.caption1.desktop.fontsize}
          fontweight = ${textstyles.caption1.desktop.fontweight}
          lineheight = ${textstyles.caption1.desktop.lineheight}
          letterspacing = ${textstyles.caption1.desktop.letterspacing}
          color = ${palettes.label.tertiary.light}
        }
      }
      episode_control_bar{
        control_button{
          # 按钮背景色
          background = {
            # 鼠标悬停颜色
            hover = ${palettes.gray.gray-10.light}
            # 鼠标点击颜色
            pressed = ${palettes.gray.gray-30.light}
            # 默认背景颜色
            default = ${palettes.gray.gray-0.light}
          }
          # 按钮内容颜色
          content_color = {
            text = ${palettes.label.primary.light}
            # 暂时不自定义图标颜色
            # icon = ${palettes.label.primary.light}
          }
        }
        play_pause_button{
          # 按钮背景色
          background = {
            # 鼠标悬停颜色
            hover = ${palettes.gray.gray-10.light}
            # 鼠标点击颜色
            pressed = ${palettes.gray.gray-30.light}
            # 默认背景颜色
            default = ${palettes.gray.gray-0.light}
          }
          # 按钮内容颜色
          content_color = {
            text = ${palettes.label.primary.light}
            # 暂时不自定义图标颜色
            # icon = ${palettes.label.primary.light}
          }
        }
      }
      episode_progress_bar{
        # 进度条轨道高度
        track_height = 3.0
        # 拖动手柄半径
        thumb_radius = 6.0
        # 轨道颜色（未播放部分）
        track_color = ${palettes.gray.gray-10.light}
        # 进度颜色（已播放部分）
        progress_color = ${palettes.brand.blue.light}
        # 手柄颜色
        thumb_color = ${palettes.brand.blue.light}
        # 时间标签样式
        time_label{
          fontsize = ${textstyles.caption2.desktop.fontsize}
          color = ${palettes.label.tertiary.light}
        }
      }
    }
  }
  # 页面样式
  # 用于配置应用的页面样式，如列表页、详情页等
  page {
    library {
        list_item{
            title{
                # Podcast Title 样式
                # 使用 typography.conf 中 textstyles.h3.desktop 样式
                # 使用 colors.conf 中 palettes.label.primary 颜色
                fontsize = ${textstyles.h3.desktop.fontsize}
                fontweight = ${textstyles.h3.desktop.fontweight}
                lineheight = ${textstyles.h3.desktop.lineheight}
                letterspacing = ${textstyles.h3.desktop.letterspacing}
                color = ${palettes.label.primary.light}
            }
        }
    }
  }

  # Container 样式
  # 用于配置应用的容器样式，如列表项、卡片等
  window_container{
    padding = 0.0
    home_toolbar{
      padding {
        top = 8.0
        bottom = 8.0
        left = 16.0
        right = 16.0
      }
      # 背景颜色
      background = ${palettes.background.transparent.light}
    }
    mini_player{
      padding {
        top = 0.0
        bottom = 0.0
        left = 0.0
        right = 0.0
      }
      # 背景颜色
      background = ${palettes.background.transparent.light}
    }
    divider{
      show = false
      height = 0.5
      thickness = 0.5
      color = ${palettes.gray.gray-20.light}
    }
    main_content{
      # 主内容区域样式
      # 四周padding
      padding {
        top = 0.0
        bottom = 4.0
        left = 4.0
        right = 4.0
      }
      # 圆角
      radius {
        top_left = 16.0
        top_right = 16.0
        bottom_left = 16.0
        bottom_right = 16.0
      }
      # 背景颜色
      background = ${palettes.background.transparent.light}
      # 侧边栏样式
      sidebar{
        padding {
          top = 0.0
          bottom = 0.0
          left = 0.0
          right = 0.0
        }
        # 背景颜色
        background = ${palettes.background.primary.light}
      }
      # 内容区域样式
      content{
        padding {
          top = 0.0
          bottom = 0.0
          left = 8.0
          right = 8.0
        }
        # 圆角
      radius {
        top_left = 0.0
        top_right = 0.0
        bottom_left = 0.0
        bottom_right = 0.0
      }
        # 背景颜色
        background = ${palettes.background.primary.light}
      }
    }
    
  }
}
