
# TinyCast 样式配置 - 整合颜色和字体排版

include "colors.conf"
include "typography.conf"

{
  version = 0.1
  name = "Styles"

  widgets{
    episode_item{
    # 用于 episode 列表项的样式
      title{
      # 使用typography.conf中 h3 样式
      # 使用colors.conf中的 label.primary 样式
        fontsize = h3.desktop.fontsize
        fontweight = h3.desktop.fontweight
        lineheight = h3.desktop.lineheight
        letterspacing = h3.desktop.letterspacing
        color = labelPrimary
      }
      description{
      # 使用typography.conf中 caption 样式
      # 使用colors.conf中的 label.tertiary 样式
        fontsize = caption.desktop.fontsize
        fontweight = caption.desktop.fontweight
        lineheight = caption.desktop.lineheight
        letterspacing = caption.desktop.letterspacing
        color = labelTertiary
      }
    }
  }
}
