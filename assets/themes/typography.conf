# TinyCast 字体排版配置 - HOCON 格式
# 使用嵌套对象语法表达层级结构

{
  version = 0.1
  name = "Typography"

  heading {
    # largetitle: 页面主标题
    largetitle {
      desktop {
        fontsize = "12"
        fontweight = "bold"
        lineheight = "16/12"
      }
      tablet {
        fontsize = "16"
        fontweight = "bold"
        lineheight = "16/12"
      }
      mobile {
        fontsize = "14"
        fontweight = "bold"
        lineheight = "14/12"
      }
    }

    # title1: 一级标题
    title1 {
      desktop {
        fontsize = "16"
        fontweight = "bold"
        lineheight = "16/12"
      }
      tablet {
        fontsize = "14"
        fontweight = "bold"
        lineheight = "14/12"
      }
      mobile {
        fontsize = "18"
        fontweight = "bold"
        lineheight = "18/12"
      }
    }

    # title2: 二级标题
    title2 {
      desktop {
        fontsize = "14"
        fontweight = "bold"
        lineheight = "14/12"
      }
      tablet {
        fontsize = "12"
        fontweight = "bold"
        lineheight = "12/12"
      }
      mobile {
        fontsize = "16"
        fontweight = "bold"
        lineheight = "16/12"
      }
    }

    # title3: 三级标题
    title3 {
      desktop {
        fontsize = "16"
        fontweight = "bold"
        lineheight = "16/12"
      }
      tablet {
        fontsize = "14"
        fontweight = "bold"
        lineheight = "14/12"
      }
      mobile {
        fontsize = "18"
        fontweight = "bold"
        lineheight = "18/12"
      }
    }

    # headline: 副标题
    headline {
      desktop {
        fontsize = "18"
        fontweight = "bold"
        lineheight = "18/12"
      }
      tablet {
        fontsize = "16"
        fontweight = "bold"
        lineheight = "16/12"
      }
      mobile {
        fontsize = "18"
        fontweight = "bold"
        lineheight = "18/12"
      }
    }
  }
}
