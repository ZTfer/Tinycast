# TinyCast 字体排版配置 - HOCON 格式
# 使用嵌套对象语法表达层级结构

{
  version = 0.1
  name = "Typography"

  heading {
    # largetitle: 页面主标题
    largetitle {
      desktop {
        fontsize = "12"
        fontweight = "bold"
        lineheight = "16/12"
      }
      tablet {
        fontsize = "16"
        fontweight = "bold"
        lineheight = "16/12"
      }
      mobile {
        fontsize = "14"
        fontweight = "bold"
        lineheight = "14/12"
      }
    }

    # title1: 一级标题
    title1 {
      desktop {
        fontsize = "16"
        fontweight = "bold"
        lineheight = "16/12"
      }
      tablet {
        fontsize = "14"
        fontweight = "bold"
        lineheight = "14/12"
      }
      mobile {
        fontsize = "18"
        fontweight = "bold"
        lineheight = "18/12"
      }
    }

    # title2: 二级标题
    title2 {
      desktop {
        fontsize = "14"
        fontweight = "bold"
        lineheight = "14/12"
      }
      tablet {
        fontsize = "12"
        fontweight = "bold"
        lineheight = "12/12"
      }
      mobile {
        fontsize = "16"
        fontweight = "bold"
        lineheight = "16/12"
      }
    }

    # title3: 三级标题
    title3 {
      desktop {
        fontsize = "16"
        fontweight = "bold"
        lineheight = "16/12"
      }
      tablet {
        fontsize = "14"
        fontweight = "bold"
        lineheight = "14/12"
      }
      mobile {
        fontsize = "18"
        fontweight = "bold"
        lineheight = "18/12"
      }
    }

    # headline: 副标题
    headline {
      desktop {
        fontsize = "18"
        fontweight = "bold"
        lineheight = "18/12"
      }
      tablet {
        fontsize = "16"
        fontweight = "bold"
        lineheight = "16/12"
      }
      mobile {
        fontsize = "18"
        fontweight = "bold"
        lineheight = "18/12"
      }
    }

    # Callout: 对应的是 iOS 系统中“正文”的标准字号，通常用于列表中的辅助说明文字、设置项的详情描述，或者是图片下方的注释
    callout {
      desktop {
        fontsize = "14"
        fontweight = "regular"
        lineheight = "14/12"
      }
      tablet {
        fontsize = "12"
        fontweight = "regular"
        lineheight = "12/12"
      }
      mobile {
        fontsize = "16"
        fontweight = "regular"
        lineheight = "16/12"
      }
    }

    # Subheadline: 对应的是 iOS 系统中“副标题”的标准字号，通常用于页面标题下方的副标题描述
    subheadline {
      desktop {
        fontsize = "16"
        fontweight = "regular"
        lineheight = "16/12"
      }
      tablet {
        fontsize = "14"
        fontweight = "regular"
        lineheight = "14/12"
      }
      mobile {
        fontsize = "18"
        fontweight = "regular"
        lineheight = "18/12"
      }
    }
  }

  # Footnote: 对应的是 iOS 系统中“脚注”的标准字号，通常用于页面底部的版权信息、免责声明等
  footnote {
    desktop {
      fontsize = "12"
      fontweight = "regular"
      lineheight = "12/12"
    }
    tablet {
      fontsize = "10"
      fontweight = "regular"
      lineheight = "10/12"
    }
    mobile {
      fontsize = "14"
      fontweight = "regular"
      lineheight = "14/12"
    }
  }

  # Caption1: 对应的是 iOS 系统中“标题”的标准字号，通常用于页面标题、图片下方的标题描述等
  caption1 {
    desktop {
      fontsize = "12"
      fontweight = "regular"
      lineheight = "12/12"
    }
    tablet {
      fontsize = "10"
      fontweight = "regular"
      lineheight = ""
    }
    mobile {
      fontsize = "14"
      fontweight = "regular"
      lineheight = ""
    }
  }

  # Caption2: 对应的是 iOS 系统中“标题”的标准字号，通常用于页面标题、图片下方的标题描述等
  caption2 {
    desktop {
      fontsize = "11"
      fontweight = "regular"
      lineheight = "12/12"
    }
    tablet {
      fontsize = "11"
      fontweight = "regular"
      lineheight = "11/12"
    }
    mobile {
      fontsize = "11"
      fontweight = "regular"
      lineheight = "11/12"
    }
  }

  # Caption3: 对应的是 iOS 系统中“标题”的标准字号，通常用于页面标题、图片下方的标题描述等
  caption3 {
    desktop {
      fontsize = "10"
      fontweight = "regular"
      lineheight = "10/12"
    }
    tablet {
      fontsize = "10"
      fontweight = "regular"
      lineheight = "10/12"
    }
    mobile {
      fontsize = "10"
      fontweight = "regular"
      lineheight = "10/12"
    }
  }


}
