# TinyCast 字体排版配置 - HOCON 格式

{
  version = 0.1
  name = "Typography"

  # 标题字号体系
  # largetitle: 页面主标题
  heading.largetitle.desktop.fontsize = "12"
  heading.largetitle.desktop.fontweight = "bold"
  heading.largetitle.desktop.lineheight = "16/12"

  heading.largetitle.tablet.fontsize = "16"
  heading.largetitle.tablet.fontweight = "bold"
  heading.largetitle.tablet.lineheight = "16/12"

  heading.largetitle.mobile.fontsize = "14"
  heading.largetitle.mobile.fontweight = "bold"
  heading.largetitle.mobile.lineheight = "14/12"

  # title1: 一级标题
  heading.title1.desktop.fontsize = "16"
  heading.title1.desktop.fontweight = "bold"
  heading.title1.desktop.lineheight = "16/12"

  heading.title1.tablet.fontsize = "14"
  heading.title1.tablet.fontweight = "bold"
  heading.title1.tablet.lineheight = "14/12"

  heading.title1.mobile.fontsize = "18"
  heading.title1.mobile.fontweight = "bold"
  heading.title1.mobile.lineheight = "18/12"

  # title2: 二级标题
  heading.title2.desktop.fontsize = "14"
  heading.title2.desktop.fontweight = "bold"
  heading.title2.desktop.lineheight = "14/12"

  heading.title2.tablet.fontsize = "12"
  heading.title2.tablet.fontweight = "bold"
  heading.title2.tablet.lineheight = "12/12"

  heading.title2.mobile.fontsize = "16"
  heading.title2.mobile.fontweight = "bold"
  heading.title2.mobile.lineheight = "16/12"

  # title3: 三级标题
  heading.title3.desktop.fontsize = "16"
  heading.title3.desktop.fontweight = "bold"
  heading.title3.desktop.lineheight = "16/12"

  heading.title3.tablet.fontsize = "14"
  heading.title3.tablet.fontweight = "bold"
  heading.title3.tablet.lineheight = "14/12"

  heading.title3.mobile.fontsize = "18"
  heading.title3.mobile.fontweight = "bold"
  heading.title3.mobile.lineheight = "18/12"

  # headline: 副标题
  heading.headline.desktop.fontsize = "18"
  heading.headline.desktop.fontweight = "bold"
  heading.headline.desktop.lineheight = "18/12"

  heading.headline.tablet.fontsize = "16"
  heading.headline.tablet.fontweight = "bold"
  heading.headline.tablet.lineheight = "16/12"

  heading.headline.mobile.fontsize = "18"
  heading.headline.mobile.fontweight = "bold"
  heading.headline.mobile.lineheight = "18/12"
}
