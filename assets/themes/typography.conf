# TinyCast 字体排版配置 - HOCON 格式
# 使用嵌套对象语法表达层级结构
# fontweight 使用数值，对应 Dart 的 FontWeight.wXXX
# letter-spacing 单位 pt

{
  version = 0.1
  name = "Typography"

  textstyles {
    # h1: 大标题
    h1 {
      fontsize = "34"
      fontweight = "700"
      lineheight = "1.2"
      letterspacing = "0.37"
      color = "labelPrimary"
    }

    # h2: 中标题
    h2 {
      fontsize = "28"
      fontweight = "700"
      lineheight = "1.2"
      letterspacing = "0.35"
      color = "labelPrimary"
    }

    # h3: 小标题
    h3 {
    # Todo: 需要调整字号，不同的状态的颜色、字重
    # 用于episode 标题文字
        desktop{
            fontsize = "14"
            fontweight = "500"
            lineheight = "1.3"
            letterspacing = "0.35"
        }
        tablet{
            fontsize = "22"
            fontweight = "600"
            lineheight = "1.3"
            letterspacing = "0.35"
        }
        mobile{
            fontsize = "22"
            fontweight = "600"
            lineheight = "1.3"
            letterspacing = "0.35"
        }
      color = "labelPrimary"
    }

    # bodyLarge: 大正文
    bodylarge {
      fontsize = "17"
      fontweight = "400"
      lineheight = "1.5"
      letterspacing = "-0.41"
      color = "labelPrimary"
    }

    # bodyMedium: 标准正文
    bodymedium {
      fontsize = "15"
      fontweight = "400"
      lineheight = "1.4"
      letterspacing = "-0.24"
      color = "labelPrimary"
    }

    # bodySmall: 小正文
    bodysmall {
      fontsize = "13"
      fontweight = "400"
      lineheight = "1.4"
      letterspacing = "-0.08"
      color = "labelSecondary"
    }

    # caption: 注释、说明文字
    caption {
        desktop{
            fontsize = "12"
            fontweight = "400"
            lineheight = "1.3"
            letterspacing = "0"
        }
        tablet{
            fontsize = "14"
            fontweight = "400"
            lineheight = "1.3"
            letterspacing = "0"
        }
        mobile{
            fontsize = "14"
            fontweight = "400"
            lineheight = "1.3"
            letterspacing = "0"
        }
        color = "labelTertiary"
    }

    # button: 按钮文字
    button {
      fontsize = "17"
      fontweight = "600"
      lineheight = "1.3"
      letterspacing = "-0.41"
      color = "labelPrimary"
    }
  }
}
