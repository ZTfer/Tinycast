# TinyCast 颜色主题配置 - HOCON 格式
# 使用嵌套对象语法表达层级结构

{
  version = 0.1
  name = "Colors"

  palettes {
    # 品牌色：用于 Logo、主按钮、高亮元素
    brand {
      primary {
        light = "#FF6200EE"
        dark = "#FFBB86FC"
      }
      secondary {
        light = "#FF03DAC6"
        dark = "#FF03DAC6"
      }
      blue {
        light = "#FF0088FF"
        dark = "#FF0091FF"
      }
    }

    # 背景色：页面、卡片、容器的底色
    background {
      primary {
        light = "#FFFFFFFF"
        dark = "#FF000000"
      }
      secondary {
        light = "#FFF2F2F7"
        dark = "#FF1C1C1E"
      }
      tertiary {
        light = "#FFFFFFFF"
        dark = "#FF2C2C2E"
      }
    }

    # 灰色阶：边框、分隔线、禁用态
    gray {
      black {
        light = "#FF000000"
        dark = "#FF000000"
      }
      gray-30 {
        light = "#30000000"
        dark = "#30FFFFFF"
      }
    }

    # 文字颜色：标题、正文、辅助文字
    label {
      primary {
        light = "#FF000000"
        dark = "#95FFFFFF"
      }
      secondary {
        light = "#603C3C43"
        dark = "#70EBEBF5"
      }
      tertiary {
        light = "#303C3C43"
        dark = "#30EBEBF5"
      }
      quaternary {
        light = "#183C3C43"
        dark = "#16EBEBF5"
      }
    }

    # 遮罩层：弹窗背景、加载遮罩
    overlay {
      default {
        light = "#20000000"
        dark = "#48000000"
      }
      transparent {
        light = "#00000000"
        dark = "#00FFFFFF"
      }
    }
  }
}
