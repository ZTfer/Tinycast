# TinyCast 颜色主题配置 - HOCON 格式
# 支持 # 和 // 注释，支持点号路径展开

{
  version = 0.1
  name = "Colors"

  # 品牌色
  palettes.brand.primary.light = "#FF6200EE"
  palettes.brand.primary.dark = "#FFBB86FC"
  palettes.brand.secondary.light = "#FF03DAC6"
  palettes.brand.secondary.dark = "#FF03DAC6"
  palettes.brand.blue.light = "#FF0088FF"
  palettes.brand.blue.dark = "#FF0091FF"

  # 背景色：页面、卡片、容器
  palettes.background.primary.light = "#FFFFFFFF"
  palettes.background.primary.dark = "#FF000000"
  palettes.background.secondary.light = "#FFF2F2F7"
  palettes.background.secondary.dark = "#FF1C1C1E"
  palettes.background.tertiary.light = "#FFFFFFFF"
  palettes.background.tertiary.dark = "#FF2C2C2E"

  # 灰色阶：边框、分隔线、禁用态
  palettes.gray.black.light = "#FF000000"
  palettes.gray.black.dark = "#FF000000"
  palettes.gray.gray-30.light = "#30000000"
  palettes.gray.gray-30.dark = "#30FFFFFF"

  # 文字颜色：标题、正文、辅助文字
  palettes.label.primary.light = "#95000000"
  palettes.label.primary.dark = "#95FFFFFF"
  palettes.label.secondary.light = "#603C3C43"
  palettes.label.secondary.dark = "#70EBEBF5"
  palettes.label.tertiary.light = "#303C3C43"
  palettes.label.tertiary.dark = "#30EBEBF5"
  palettes.label.quaternary.light = "#183C3C43"
  palettes.label.quaternary.dark = "#16EBEBF5"

  # 遮罩层：弹窗背景、加载遮罩
  palettes.overlay.default.light = "#20000000"
  palettes.overlay.default.dark = "#48000000"
  palettes.overlay.transparent.light = "#00000000"
  palettes.overlay.transparent.dark = "#00FFFFFF"
}
