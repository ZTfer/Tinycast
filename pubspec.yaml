# ============================================================================
# TinyCast - 播客应用
# ============================================================================
name: tinycast
description: "A Tiny Podcast App."
publish_to: 'none'

# 版本号: 主版本号.次版本号.修订号+构建号
version: 1.0.0+1

# 指定 Dart SDK 版本约束，^3.9.2 表示兼容 3.9.2 及以上但小于 4.0.0 的版本
environment:
  sdk: ^3.9.2

# ============================================================================
# 生产环境依赖 (dependencies)
# ============================================================================
dependencies:
  flutter:
    sdk: flutter

  # --------------------------------------------------------------------------
  # UI 与图标
  # --------------------------------------------------------------------------
  # Lucide 图标库 (Flutter 封装，项目中使用此图标库)
  lucide_icons_flutter: ^3.1.12
  # SVG 图片渲染支持
  flutter_svg: ^2.2.4

  # --------------------------------------------------------------------------
  # 文件选择与桌面端支持
  # --------------------------------------------------------------------------
  # 文件选择器 (用于导入播客/音频文件)
  file_picker: ^11.0.2
  # 桌面端窗口管理 (支持 macOS/Windows/Linux)
  window_manager: ^0.5.1
  # 桌面端多窗口支持
  desktop_multi_window: ^0.3.0

  # --------------------------------------------------------------------------
  # 数据库 (本地存储)
  # --------------------------------------------------------------------------
  # Isar 数据库 (轻量级、高性能的本地数据库)
  isar_community: ^3.3.2
  # Isar 数据库的 Flutter 原生库支持
  isar_community_flutter_libs: ^3.3.2

  # --------------------------------------------------------------------------
  # 状态管理
  # --------------------------------------------------------------------------
  # Riverpod 核心库 (响应式状态管理)
  riverpod: ^3.2.1
  # Riverpod 的 Flutter 集成
  flutter_riverpod: ^3.3.1

  # --------------------------------------------------------------------------
  # 音频播放
  # --------------------------------------------------------------------------
  # 音频播放器 (支持本地和网络音频)
  just_audio: ^0.10.5
  # 后台音频服务支持 (锁屏控制、通知栏控制等)
  audio_service: ^0.18.18

  # --------------------------------------------------------------------------
  # 网络请求
  # --------------------------------------------------------------------------
  # HTTP 客户端 (支持拦截器、重试等高级功能)
  dio: ^5.9.2
  # Dio 的 HTTP/2 适配器
  dio_http2_adapter: ^2.0.0

  # --------------------------------------------------------------------------
  # RSS 解析
  # --------------------------------------------------------------------------
  # RSS 订阅解析器 (用于解析播客 RSS feed)
  rss_dart: ^1.0.12
  # XML 解析库 (RSS feed 通常基于 XML)
  xml: ^6.6.1

  # --------------------------------------------------------------------------
  # 文件与路径管理
  # --------------------------------------------------------------------------
  # 获取平台特定的目录路径 (缓存目录、文档目录等)
  path_provider: ^2.1.4
  # 路径操作工具 (路径拼接、解析等)
  path: ^1.9.1

  # --------------------------------------------------------------------------
  # 图片缓存
  # --------------------------------------------------------------------------
  # 网络图片缓存与加载 (支持占位图、错误处理等)
  cached_network_image: ^3.4.1

  # --------------------------------------------------------------------------
  # 加密与安全
  # --------------------------------------------------------------------------
  # 加密算法支持 (SHA256, MD5 等，用于文件命名/校验)
  crypto: ^3.0.3
  # 安全存储 (用于存储敏感信息如 token、密码等)
  flutter_secure_storage: ^10.0.0

  # --------------------------------------------------------------------------
  # 国际化与日期时间
  # --------------------------------------------------------------------------
  # 国际化和日期/数字格式化
  intl: ^0.20.2

  # --------------------------------------------------------------------------
  # HTML 处理
  # --------------------------------------------------------------------------
  # HTML 解析器 (用于处理播客描述中的 HTML 内容)
  html: ^0.15.4
  # 将 HTML 转换为 Flutter Widget
  flutter_widget_from_html: ^0.17.2

  # --------------------------------------------------------------------------
  # 本地 JNI 调用 (原生平台交互)
  # --------------------------------------------------------------------------
  # Java Native Interface 支持 (Android 原生调用)
  jni: ^1.0.0
  # JNI 的 Flutter 集成
  jni_flutter: ^1.0.1

  # --------------------------------------------------------------------------
  # 本地设置存储
  # --------------------------------------------------------------------------
  # SharedPreferences 封装 (用于存储简单的键值对设置)
  shared_preferences: ^2.5.5

  # --------------------------------------------------------------------------
  # 环境变量管理
  # --------------------------------------------------------------------------
  # 读取 .env 文件中的环境变量
  flutter_dotenv: ^5.2.1

  # --------------------------------------------------------------------------
  # Supabase 云服务
  # --------------------------------------------------------------------------
  # Supabase Flutter SDK (认证、数据库、存储等)
  supabase_flutter: ^2.12.4

# ============================================================================
# 开发环境依赖 (dev_dependencies)
# ============================================================================
dev_dependencies:
  # Flutter 测试框架
  flutter_test:
    sdk: flutter

  # --------------------------------------------------------------------------
  # 代码质量
  # --------------------------------------------------------------------------
  # Flutter 代码 lint 规则
  flutter_lints: ^6.0.0

  # --------------------------------------------------------------------------
  # 数据库代码生成
  # --------------------------------------------------------------------------
  # Isar 数据库代码生成器
  isar_community_generator: ^3.3.2
  # Dart 代码生成器框架
  build_runner: ^2.13.1

  # --------------------------------------------------------------------------
  # 测试与 Mock
  # --------------------------------------------------------------------------
  # Mock 对象生成 (用于单元测试)
  mockito: ^5.6.4
  # 测试匹配器库
  matcher: ^0.12.16
  # Dart 测试框架
  test: ^1.30.0

# ============================================================================
# Flutter 配置
# ============================================================================
flutter:
  # 使用 Material Design 组件
  uses-material-design: true

  # 静态资源文件目录
  assets:
    # 图片资源
    - assets/images/
    # 图标资源
    - assets/icons/
    # Gravity Icons 图标资源
    - assets/gravity_icons/
