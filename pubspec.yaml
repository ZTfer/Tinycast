name: tinycast
description: "A Tiny Podcast App."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  lucide_icons: ^0.257.0
  file_picker: ^11.0.2
  lucide_icons_flutter: ^3.1.12
  flutter_svg: ^2.2.4
  window_manager: ^0.5.1
  desktop_multi_window: ^0.3.0
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  riverpod: ^3.2.1
  flutter_riverpod: ^3.3.1
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  dio: ^5.9.2
  dio_http2_adapter: ^2.0.0
  rss_dart: ^1.0.12
  path_provider: ^2.1.4
  cached_network_image: ^3.4.1
  xml: ^6.6.1
  path: ^1.9.1
  crypto: ^3.0.3
  intl: ^0.20.2
  jni: ^1.0.0
  jni_flutter: ^1.0.1
  html: ^0.15.4
  flutter_widget_from_html: ^0.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.13.1
  mockito: ^5.6.4
  matcher: ^0.12.16
  test: ^1.30.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
